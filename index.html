<!DOCTYPE html>
<html lang="no">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KARAOKE!</title>
  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Style the button */
    #generate-btn {
      background-color: #F7C8E0;
      color: #ffffff;
      font-weight: bold;
      padding-top: 1px;
      padding-bottom: 1px;
      height: 170px;
      width: 170px;
      border: none;
      border-radius: 100%;
      cursor: pointer;
      transition: transform 0.2s ease-in-out;
      /* add transition effect */
      font-size: 1.7em;
      font-color: orange;
      margin-bottom: 1em;
    }
	  
</style>
</head>
<body style="background-color:#B4E4FF;">
  <header>
    <h1>WHICH KARAOKE SONG SHOULD I SING?</h1>
  </header>
  <main>
    <div class="button-container">
      <button id="generate-btn">SONG!</button>
    </div>
    <div class="result"></div>
    <div class="button-container"></div>
	  <h2>PRESS AGAIN TO RETRY!</h2>

  </main>
  <section>
  </section>
  <body>
    <h1>How many karaoke songs are in the database?</h1>
    <p id="result">Loading...</p>
  </body>
  <body>
    <p>RULE THE KARAOKE STAGE!</p>
  </body>
  <script src="script.js"></script>
  <script>
    // Load the CSV file
    var request = new XMLHttpRequest();
    request.open("GET", "data.csv", true);
    request.onload = function() {
      // Parse the CSV data
      var csvData = request.responseText;
      var csvRows = csvData.split("\n");
      var rowCount = csvRows.length;

      // Update the HTML element with the row count
      var resultElement = document.getElementById("result");
      resultElement.innerHTML = "There are " + rowCount + " songs in the database!";
    };
    request.send();
  </script>
</body>
</html>
