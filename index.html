<!DOCTYPE html>
<html>
<head>
	<title>Karaoke Song Selector</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<h1>Karaoke Song Selector</h1>
		<p>Select the type of song you want to sing:</p>
		<div class="btn-group">
			<button class="genre-btn" data-type="">All</button>
			<button class="genre-btn" data-type="Happy!">Happy!</button>
			<button class="genre-btn" data-type="Ballad!">Ballad!</button>
			<button class="genre-btn" data-type="Banger!">Banger!</button>
			<button class="genre-btn" data-type="Rock!">Rock!</button>
			<button class="genre-btn" data-type="Duet!">Duet!</button>
			<button class="genre-btn" data-type="Soulful!">Soulful!</button>
		</div>
</body>

<body>
	<div class="container">

	<button class="select-btn" onclick="selectSong()">Select Song</button>
		<div id="song-result"></div>
	</div>

	<script src="script.js"></script>
</body>
</html>
