<!DOCTYPE html>
<html>
<head>
	<title>Karaoke Song Selector</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<h1>Karaoke Song Selector</h1>
		<p>Select the genre of the song you want to sing:</p>
		<div class="btn-group">
			<option value="">All</option>
			<option value="Happy!">Happy!</option>
			<option value="Power ballad!"">Power ballad!</option>
			<option value="Banger!">Banger!</option>
			<option value="Rock!">Rock!</option>
			<option value="Duet!">Duet!</option>
			<option value="Soulful!">Soulful!</option>
</div>
		<button id="select-song-btn">Select Song</button>
		<div id="song-result"></div>
	</div>

	<script src="script.js"></script>
</body>
</html>
