<!DOCTYPE html>
<html>
<head>
	<title>Karaoke Song Selector</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<div class="container">
		<h1>Karaoke Song Selector</h1>
		<p>Select the genre of the song you want to sing:</p>
		<div class="btn-group">
			<button class="genre-btn" data-genre="">All</button>
			<button class="genre-btn" data-genre="Happy!">Happy!</button>
			<button class="genre-btn" data-genre="Power ballad!">Power ballad!</button>
			<button class="genre-btn" data-genre="Banger!">Banger!</button>
			<button class="genre-btn" data-genre="Rock!">Rock!</button>
			<button class="genre-btn" data-genre="Duet!">Duet!</button>
			<button class="genre-btn" data-genre="Soulful!">Soulful!</button>
		</div>
		<button id="select-song-btn">Select Song</button>
		<div id="song-result"></div>
	</div>

	<script src="script.js"></script>
</body>
</html>
